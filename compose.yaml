services:
  econpulse:
    image: econpulse:latest
    container_name: econpulse-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3014:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # The baked file inside the image. To swap data without rebuilding, mount a
      # release and point at it instead:
      #
      #   ECONPULSE_DB: "/data/econpulse.db"
      #   volumes:
      #     - /srv/econpulse:/data:ro
