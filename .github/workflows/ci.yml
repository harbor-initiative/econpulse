name: Gates

# The three commands a person has been running by hand before every merge. Until
# this file existed, the only thing keeping main honest was somebody remembering.
#
# The database is 110 MB, so it comes from the release rather than the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # Six gates, and the outlines take four minutes. A run that exceeds this is
    # hung, and a hung gate is worse than a red one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch the released database
        run: |
          curl -sSL -o /tmp/econpulse.db.gz \
            https://github.com/harbor-initiative/econpulse/releases/download/v0.1.0-data/econpulse-2026.10.db.gz
          mkdir -p data
          gunzip -c /tmp/econpulse.db.gz > data/econpulse.db

      - name: The type gate
        run: npx tsc --noEmit

      - name: Fetch the county outlines
        run: node scripts/fetch-boundaries.mjs

      - name: The test suite
        run: npm test

      - name: The data gate
        run: npm run verify

      - name: The rendered HTML has not moved
        run: node scripts/snapshot-html.mjs --check

      - name: The design gate
        run: node scripts/design-check.mjs

      - name: The print gate
        run: node scripts/pdf-check.mjs

      - name: Keep what the gates measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: |
            /tmp/econpulse-print-check.pdf
          if-no-files-found: ignore
